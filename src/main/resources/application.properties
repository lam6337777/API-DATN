spring.application.name=shoe-store-api

# Cấu hình bí mật đọc từ biến môi trường. Khi chạy local, các giá trị thật nằm trong
# config/local.properties (không commit) — file này được nạp nếu tồn tại.
spring.config.import=optional:file:./config/local.properties

# PostgreSQL
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/shoe}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver
# Gói free của Neon/Render giới hạn số kết nối
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Logging
logging.level.org.springframework.web=${LOG_LEVEL_WEB:INFO}
logging.level.shoe.com.api=${LOG_LEVEL_APP:INFO}

# JWT — bắt buộc đặt JWT_SECRET (chuỗi ngẫu nhiên dài) trên server
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration=86400000

# Các domain frontend được phép gọi API (phân tách bằng dấu phẩy)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3001}

# File Upload
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=20MB

# Session
spring.session.store-type=none

# Server — Render/Heroku truyền cổng qua biến PORT
server.port=${PORT:8082}
server.forward-headers-strategy=framework

# Upload: lưu trên Cloudinary nếu có CLOUDINARY_URL, ngược lại lưu ổ đĩa local
app.upload.dir=${UPLOAD_DIR:./uploads}
app.upload.url-prefix=/uploads
app.cloudinary.url=${CLOUDINARY_URL:}
app.cloudinary.folder=${CLOUDINARY_FOLDER:pf-shoes}

# Swagger
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Mail (Gmail App Password)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
